name: policy-simulate-impact
on:
  pull_request:
    paths:
      - 'baseline-catalog/**'
      - 'exception-registry/**'
      - 'asset-register/**'
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -c "import sys; sys.path.append('policy-engine'); from app.main import simulate_impact; print(simulate_impact({'mode':'pr'}))"
