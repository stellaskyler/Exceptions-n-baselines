name: evaluate-policy
on:
  workflow_call:
    inputs:
      asset_id:
        required: true
        type: string
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: policy/baseline-eval
        run: python -c "import sys; sys.path.append('policy-engine'); from app.main import evaluate; print(evaluate({'asset_id':'${{ inputs.asset_id }}','check_results':{}}))"
